<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏪 Tiendita - Punto de Venta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e5799 0%, #2989d8 50%, #207cca 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #1e5799;
            font-size: 24px;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #1e5799;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #154377;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <span style="font-size: 48px;">🏪</span>
            <h1>Tiendita POS</h1>
        </div>
        
        <h2 style="color: #333; margin-bottom: 20px;">¡Bienvenido!</h2>
        <p style="color: #666; margin-bottom: 30px;">Haz clic para entrar al sistema</p>
        
        <button class="btn" onclick="entrar()">Entrar al Sistema</button>
    </div>

    <script>
        function entrar() {
            alert('✅ ¡Bienvenido a tu Tiendita!');
            // Aquí puedes redirigir a tu menú principal cuando lo tengas listo
            // window.location.href = 'menu.html';
        }
    </script>
</body>
</html>
